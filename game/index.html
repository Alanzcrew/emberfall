<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Emberfall v2 — a 2D arena-survival roguelite. Hold the light, survive the dark, dash through the glooms and face the Gloomlord.">
<title>Emberfall</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0b1e; }
  body { display: flex; align-items: center; justify-content: center; }
  /* 1280x720 backing store, CSS-scaled to fit the window while keeping 16:9. */
  #game {
    display: block;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    background: #0d0b1e;
    touch-action: none;
    cursor: crosshair;
    image-rendering: auto;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Emberfall: move with WASD, aim with the mouse, hold click to fire ember bolts, Shift or right click to dash"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
